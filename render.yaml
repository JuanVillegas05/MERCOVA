envVarGroups:
  - name: mercova-config
    envVars:
      - key: APP_NAME
        value: Mercova
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: es
      - key: APP_FALLBACK_LOCALE
        value: es
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: mysql
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      # Render (plan free) bloquea los puertos SMTP salientes: el correo sale
      # por la API HTTP de Brevo (App\Mail\Transport\BrevoTransport).
      - key: MAIL_MAILER
        value: brevo
      - key: MAIL_FROM_NAME
        value: Mercova

services:
  - type: web
    name: mercova-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: principal
    healthCheckPath: /up
    # Migra y luego arranca con el script de la imagen (mercova-web), que
    # pone Apache en el $PORT de Render, corre optimize y ajusta permisos.
    startCommand: "php artisan migrate --force && mercova-web"
    envVars:
      - fromGroup: mercova-config
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        sync: false
      - key: BREVO_API_KEY
        sync: false
      # Imágenes de productos/servicios. Obligatorio: el disco de Render se
      # borra en cada despliegue. cloudinary://{api_key}:{api_secret}@{cloud_name}
      - key: CLOUDINARY_URL
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      - key: MERCOVA_FRONTEND_URL
        sync: false
      - key: MERCOVA_ADMIN_EMAILS
        sync: false

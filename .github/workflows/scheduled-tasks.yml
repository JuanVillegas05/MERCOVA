# Ejecuta las tareas programadas de Mercova (cancelar pedidos sin pagar y
# conciliar pagos de planes con Wompi). El plan gratuito de Render no corre
# "schedule:run", así que este workflow llama al endpoint protegido.
#
# Requiere el secret del repositorio MERCOVA_CRON_SECRET (Settings → Secrets
# and variables → Actions), igual al de la variable de entorno en Render.
name: Tareas programadas

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a /api/cron/run
        env:
          CRON_SECRET: ${{ secrets.MERCOVA_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta el secret MERCOVA_CRON_SECRET en el repositorio."
            exit 1
          fi
          # --retry cubre el arranque en frío del plan gratuito (~50 s).
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST https://mercova-api.onrender.com/api/cron/run \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $CRON_SECRET"
